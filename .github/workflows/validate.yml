name: Workflow checks
on: [push, pull_request]
jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: A calculations and handoff
        working-directory: A/.agents/skills/boost-system-design/scripts
        run: python -B -m unittest discover -p 'test_*.py' -v
      - name: B input contract
        run: python -B -m unittest discover -s B/tests -v
      - name: C software checks (native checks skip without KiCad)
        run: python -B -m unittest discover -s C/tests -v
